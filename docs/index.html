<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Szófüzet</title>

<meta name="theme-color" content="#356C40"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Szófüzet"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#F3F6F3;--s:#fff;--ink:#17291C;--mu:#556B5A;--li:#D5E1D7;--bl:#356C40;--bs:#E2ECE4;--mk:#C9DFCC;--g:#356C40;--gs:#E2ECE4;--b:#C2363A;--bss:#FBE3E3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A12;--s:#172A1B;--ink:#EAF6EE;--mu:#A3B8A7;--li:#2B4631;--bl:#8CBF97;--bs:#24432B;--mk:#4C7D55;--g:#5BD394;--gs:#163D33;--b:#FF8A8D;--bss:#4A1F2A;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
.w{max-width:600px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0;font-weight:800}h1 span{background:linear-gradient(transparent 55%,var(--mk) 55%)}
h2{font-size:19px;margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}.tn{font-variant-numeric:tabular-nums}
.card{background:var(--s);border:1px solid var(--li);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--bl);border-color:var(--bl);color:var(--s)}.btn.gh{border-color:transparent;background:none;color:var(--bl);padding-inline:8px}
.btn.hd{border-color:var(--b);color:var(--b)}
.btn:disabled{opacity:.5}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--li)}
.nav button{flex:1;border:0;background:none;padding:8px 4px 10px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer}
.nav button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--bl)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--bl);border-color:var(--bl);color:var(--s)}
.seg{display:flex;flex-wrap:wrap;gap:4px}.seg button{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer}
.lbl{font-size:13px;font-weight:600;color:var(--mu);margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--li);overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
.fc{min-height:220px;border-radius:20px;border:1px solid var(--li);background:var(--s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;cursor:pointer}
.fc.back{background:var(--bs)}
.big{font-size:32px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.ex{font-style:italic;color:var(--mu);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;border:1px solid var(--li);background:var(--s);border-radius:12px;padding:13px 14px;cursor:pointer}
.opt.ok{background:var(--gs);border-color:var(--g)}.opt.no{background:var(--bss);border-color:var(--b)}
.list{background:var(--s);border:1px solid var(--li);border-radius:14px}
.it{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--li)}.it:last-child{border:0}
.it b{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--b);background:var(--bss);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.inp{width:100%;border:1px solid var(--li);background:var(--s);border-radius:10px;padding:10px 12px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.days i{display:block;background:var(--bl);border-radius:3px 3px 0 0;min-height:2px}
.days i.z{background:var(--li)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.warn{background:var(--bss);color:var(--b);border-radius:10px;padding:10px 12px;font-size:14px}
.say{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;vertical-align:middle;border-radius:8px}
.fb{border-radius:10px;padding:10px 12px;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fb.ok{background:var(--gs)}.fb.no{background:var(--bss)}
.it3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--li)}.it3:last-child{border:0}
.fire{gap:10px}.flame{display:flex;align-items:center;gap:2px;font-size:28px;line-height:1}.flame b{font-size:26px;font-weight:800}.flame.off{filter:grayscale(1);opacity:.55}
.bar.goal i{background:var(--g)}.days i.g{background:var(--g)}
.pts{font-size:22px;font-weight:800;color:var(--bl)}
.ov{position:fixed;inset:0;background:rgba(6,30,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.pop{width:100%;max-width:440px;max-height:90vh;overflow:auto}
.fact{border:1px solid var(--li);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.team{background:var(--bl);color:var(--s);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.fen{font-size:16px;font-weight:600;line-height:1.4}
.inst{border-color:var(--bl);background:var(--bs)}
.kn{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--mu);white-space:nowrap}.kn.on{background:var(--g);border-color:var(--g);color:var(--s)}.it3.kd b{opacity:.75}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{background:var(--bs);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
</style></head><body><div class="w" id="app"></div>

d Business Review (March–April 2026)", "lesson": "Lecke nélkül", "topic": "Munka", "c": 1794305751353.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}, {"en": "flourish", "hu": "virágzik, boldogul", "pos": "ige", "example": "The leader helps ideas flourish.", "book": "Harvard Business Review (March–April 2026)", "lesson": "Lecke nélkül", "topic": "Munka", "c": 1794305751354.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}, {"en": "special", "hu": "különleges", "pos": "mn", "example": "They need a special kind of leader.", "book": "Harvard Business Review (March–April 2026)", "lesson": "Lecke nélkül", "topic": "Egyéb", "c": 1794305751355.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}, {"en": "kind", "hu": "fajta, típus", "pos": "fn", "example": "a special kind of leader", "book": "Harvard Business Review (March–April 2026)", "lesson": "Lecke nélkül", "topic": "Egyéb", "c": 1794305751356.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}, {"en": "page", "hu": "oldal", "pos": "fn", "example": "See page 74.", "book": "Harvard Business Review (March–April 2026)", "lesson": "Lecke nélkül", "topic": "Iskola", "c": 1794305751357.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}], "log": {}, "facts": {"past": [{"team": "fradi", "en": "Ferencváros was founded in 1899 in the 9th district of Budapest. The club colours are green and white, and its symbol is the eagle.", "t": "A Ferencvárosi Torna Clubot 1899-ben alapították Budapest IX. kerületében. A klub színe a zöld-fehér, a jelképe a sas."}, {"team": "fradi", "en": "Fradi won their first Hungarian league title in 1903.", "t": "A Fradi 1903-ban nyerte első magyar bajnoki címét."}, {"team": "fradi", "en": "In 1965 Fradi won the Inter-Cities Fairs Cup, the old version of today's Europa League. They beat Juventus 1–0 in the final in Turin. No other Hungarian club has ever won a European cup.", "t": "1965-ben a Fradi megnyerte a Vásárvárosok Kupáját, a mai Európa-liga elődjét. A döntőben Torinóban 1–0-ra verte a Juventust. Máig ez az egyetlen európai kupagyőzelem magyar klubtól."}, {"team": "fradi", "en": "On the way to the 1965 final, Fradi knocked out Manchester United in the semi-final after a third, deciding match.", "t": "Az 1965-ös döntő felé vezető úton a Fradi az elődöntőben egy harmadik, döntő meccs után ejtette ki a Manchester Unitedet."}, {"team": "fradi", "en": "Flórián Albert, a Fradi legend, won the Ballon d'Or in 1967. He is the only Hungarian player who has ever won it. Fradi's old stadium was named after him.", "t": "Albert Flórián, a Fradi legendája 1967-ben megnyerte az Aranylabdát. Ő az egyetlen magyar, aki valaha elnyerte. A Fradi régi stadionja róla kapta a nevét."}, {"team": "fradi", "en": "In 1975 Fradi played in the European Cup Winners' Cup final in Basel. They lost to Dynamo Kyiv, but very few Hungarian teams have ever got that far.", "t": "1975-ben a Fradi a Kupagyőztesek Európa Kupája döntőjében játszott Bázelben. A Dinamo Kijev ellen kikapott, de kevés magyar csapat jutott ilyen messzire."}, {"team": "fradi", "en": "In 1995 Fradi became the first Hungarian team to reach the group stage of the Champions League.", "t": "1995-ben a Fradi lett az első magyar csapat, amelyik bejutott a Bajnokok Ligája csoportkörébe."}, {"team": "fradi", "en": "In 2006 Fradi was sent down to the second division because of money problems. The fans stayed loyal, and the team came back to the top league in 2009.", "t": "2006-ban a Fradit anyagi gondok miatt a másodosztályba sorolták. A szurkolók kitartottak, és 2009-ben a csapat visszajutott az élvonalba."}, {"team": "fradi", "en": "In 2020 Fradi reached the Champions League group stage again after 25 years. They played against Barcelona and Juventus.", "t": "2020-ban a Fradi 25 év után újra BL-csoportkörbe jutott, ahol a Barcelonával és a Juventusszal is játszott."}, {"team": "fradi", "en": "Fradi is the record champion of Hungary: by 2025 they had won 36 league titles, including seven in a row from 2019 to 2025.", "t": "A Fradi a magyar bajnokság rekordere: 2025-ig 36 bajnoki címet nyert, ebből hetet zsinórban 2019 és 2025 között."}, {"team": "fradi", "en": "The Groupama Arena opened in 2014, where the old Üllői út stadium used to be. More than 22,000 fans can watch a match there.", "t": "A Groupama Aréna 2014-ben nyílt meg a régi Üllői úti stadion helyén. Több mint 22 ezer néző fér el benne."}, {"team": "inter", "en": "Inter was founded in 1908 by members of AC Milan who wanted to sign foreign players too. That is where the name comes from: Internazionale means international.", "t": "Az Intert 1908-ban a Milan néhány tagja alapította, mert külföldi játékosokat is akartak igazolni. Innen a név: Internazionale, vagyis nemzetközi."}, {"team": "inter", "en": "Inter's nickname is the Nerazzurri. In Italian it means black and blue, the colours of the shirt.", "t": "Az Inter beceneve Nerazzurri, ami olaszul fekete-kéket jelent: ez a mez színe."}, {"team": "inter", "en": "Inter is the only Italian club that has never been relegated from Serie A.", "t": "Az Inter az egyetlen olasz klub, amely soha nem esett ki a Serie A-ból."}, {"team": "inter", "en": "In 1964 and 1965, Helenio Herrera's 'Grande Inter' won the European Cup two years in a row.", "t": "1964-ben és 1965-ben Helenio Herrera „Nagy Intere” zsinórban kétszer nyerte meg a BEK-et."}, {"team": "inter", "en": "Giacinto Facchetti was a defender who loved to attack and score. Inter retired his shirt number 3, so no one else can wear it.", "t": "Giacinto Facchetti hátvéd volt, aki imádott támadni és gólt lőni. Az Inter visszavonultatta a 3-as mezét, azóta senki sem viselheti."}, {"team": "inter", "en": "In 2010 José Mourinho's Inter won the treble: the league, the Italian Cup and the Champions League. No Italian team had done it before.", "t": "2010-ben José Mourinho Intere triplázott: bajnokság, olasz kupa és Bajnokok Ligája. Olasz csapatnak ez előtte nem sikerült."}, {"team": "inter", "en": "In the 2010 Champions League final in Madrid, Diego Milito scored both goals as Inter beat Bayern Munich 2–0.", "t": "A 2010-es BL-döntőben Madridban Diego Milito mindkét gólt lőtte, az Inter 2–0-ra verte a Bayern Münchent."}, {"team": "inter", "en": "Javier Zanetti played 858 official matches for Inter. That is the club record, almost 20 seasons of football.", "t": "Javier Zanetti 858 hivatalos meccset játszott az Interben. Ez klubrekord, majdnem 20 szezonnyi foci."}, {"team": "inter", "en": "In 1997 Inter paid a world record fee for the Brazilian Ronaldo, called 'Il Fenomeno', the Phenomenon. He is not the same person as Cristiano Ronaldo!", "t": "1997-ben az Inter világrekord összegért igazolta le a brazil Ronaldót, akit Il Fenomenónak hívtak. Ő nem azonos Cristiano Ronaldóval!"}, {"team": "inter", "en": "Inter and AC Milan share the same stadium, the San Siro. Its official name is Stadio Giuseppe Meazza, after a famous Inter striker who won two World Cups.", "t": "Az Inter és a Milan ugyanabban a stadionban játszik, a San Siróban. Hivatalos neve Giuseppe Meazza Stadion, egy legendás, kétszeres világbajnok Inter-csatár után."}, {"team": "lfc", "en": "Liverpool FC was born in 1892, after Everton moved out of Anfield. That is why the two neighbours are such big rivals.", "t": "A Liverpool 1892-ben jött létre, miután az Everton elköltözött az Anfieldről. Ezért olyan nagy a két szomszéd rivalizálása."}, {"team": "lfc", "en": "Bill Shankly became Liverpool's manager in 1959, when the club was in the second division. He built the team that later won almost everything.", "t": "Bill Shankly 1959-ben lett a Liverpool menedzsere, amikor a klub még a másodosztályban játszott. Ő építette fel azt a csapatot, amely később szinte mindent megnyert."}, {"team": "lfc", "en": "The Kop, Liverpool's most famous stand, is named after Spion Kop, a hill where a famous battle took place in South Africa in 1900.", "t": "A Kop, a Liverpool leghíresebb lelátója egy dél-afrikai dombról, a Spion Kopról kapta a nevét, ahol 1900-ban híres csatát vívtak."}, {"team": "lfc", "en": "Liverpool fans have sung 'You'll Never Walk Alone' together before every match since the 1960s.", "t": "A Liverpool szurkolói az 1960-as évek óta minden meccs előtt együtt éneklik a „You'll Never Walk Alone” című dalt."}, {"team": "lfc", "en": "In the 2005 Champions League final in Istanbul, Liverpool were 3–0 down against AC Milan at half-time. They scored three goals in six minutes and won on penalties!", "t": "A 2005-ös isztambuli BL-döntőben a Liverpool félidőben 3–0-ra vesztett a Milan ellen. Hat perc alatt három gólt lőtt, és tizenegyesekkel nyert!"}, {"team": "lfc", "en": "Captain Steven Gerrard started the 2005 comeback in Istanbul with a header.", "t": "Steven Gerrard csapatkapitány egy fejes góllal indította el a 2005-ös isztambuli fordítást."}, {"team": "lfc", "en": "In 2019 Liverpool lost 3–0 in Barcelona in the Champions League semi-final. At Anfield they won 4–0, and Divock Origi and Georginio Wijnaldum both scored twice.", "t": "2019-ben a Liverpool 3–0-ra kikapott Barcelonában a BL-elődöntőben. Az Anfielden 4–0-ra nyert, Divock Origi és Georginio Wijnaldum is duplázott."}, {"team": "lfc", "en": "Jürgen Klopp came to Liverpool in 2015. With him the club won the Champions League in 2019 and the Premier League in 2020, the first league title in 30 years.", "t": "Jürgen Klopp 2015-ben érkezett a Liverpoolhoz. Vele a klub 2019-ben BL-t, 2020-ban pedig 30 év után újra bajnokságot nyert."}, {"team": "lfc", "en": "Ian Rush is Liverpool's all-time top scorer with 346 goals.", "t": "Ian Rush 346 góllal a Liverpool minden idők legjobb góllövője."}, {"team": "lfc", "en": "Before every home game, Liverpool players touch the 'This Is Anfield' sign in the tunnel for good luck.", "t": "Minden hazai meccs előtt a Liverpool játékosai a folyosón megérintik a „This Is Anfield” táblát, mert szerencsét hoz."}, {"team": "lfc", "en": "Dominik Szoboszla
