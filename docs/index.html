<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Szójáték</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#356C40"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Szójáték"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#F3F6F3;--s:#fff;--ink:#17291C;--mu:#556B5A;--li:#D5E1D7;--bl:#356C40;--bs:#E2ECE4;--mk:#C9DFCC;--g:#356C40;--gs:#E2ECE4;--b:#C2363A;--bss:#FBE3E3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A12;--s:#172A1B;--ink:#EAF6EE;--mu:#A3B8A7;--li:#2B4631;--bl:#8CBF97;--bs:#24432B;--mk:#4C7D55;--g:#5BD394;--gs:#163D33;--b:#FF8A8D;--bss:#4A1F2A;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
.w{max-width:600px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0;font-weight:800}h1 span{background:linear-gradient(transparent 55%,var(--mk) 55%)}
h2{font-size:19px;margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}.tn{font-variant-numeric:tabular-nums}
.card{background:var(--s);border:1px solid var(--li);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--bl);border-color:var(--bl);color:var(--s)}.btn.gh{border-color:transparent;background:none;color:var(--bl);padding-inline:8px}
.btn.hd{border-color:var(--b);color:var(--b)}
.btn:disabled{opacity:.5}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--li)}
.nav button{flex:1;border:0;background:none;padding:8px 4px 10px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer}
.nav button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--bl)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--bl);border-color:var(--bl);color:var(--s)}
.seg{display:flex;flex-wrap:wrap;gap:4px}.seg button{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer}
.seg.tch{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}.seg.tch button{padding:12px 6px;font-size:16px}
.lbl{font-size:13px;font-weight:600;color:var(--mu);margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--li);overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
.fc{min-height:220px;border-radius:20px;border:1px solid var(--li);background:var(--s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;cursor:pointer}
.fc.back{background:var(--bs)}
.big{font-size:32px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.ex{font-style:italic;color:var(--mu);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;border:1px solid var(--li);background:var(--s);border-radius:12px;padding:13px 14px;cursor:pointer}
.opt.ok{background:var(--gs);border-color:var(--g)}.opt.no{background:var(--bss);border-color:var(--b)}
.list{background:var(--s);border:1px solid var(--li);border-radius:14px}
.it{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--li)}.it:last-child{border:0}
.it b{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--b);background:var(--bss);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.inp{width:100%;border:1px solid var(--li);background:var(--s);border-radius:10px;padding:10px 12px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.days i{display:block;background:var(--bl);border-radius:3px 3px 0 0;min-height:2px}
.days i.z{background:var(--li)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.warn{background:var(--bss);color:var(--b);border-radius:10px;padding:10px 12px;font-size:14px}
.say{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;vertical-align:middle;border-radius:8px}
.fb{border-radius:10px;padding:10px 12px;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fb.ok{background:var(--gs)}.fb.no{background:var(--bss)}
.it3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--li)}.it3:last-child{border:0}
.lsn>summary{cursor:pointer;padding:2px 0}.lsn .list{margin-top:8px}.tagb{border:0;cursor:pointer;font-family:inherit}
.fire{gap:10px}.flame{display:flex;align-items:center;gap:2px;font-size:28px;line-height:1}.flame b{font-size:26px;font-weight:800}.flame.off{filter:grayscale(1);opacity:.55}
.bar.goal i{background:var(--g)}.days i.g{background:var(--g)}
.pts{font-size:22px;font-weight:800;color:var(--bl)}
.ov{position:fixed;inset:0;background:rgba(6,30,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.pop{width:100%;max-width:440px;max-height:90vh;overflow:auto}
.fact{border:1px solid var(--li);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.team{background:var(--bl);color:var(--s);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.fen{font-size:16px;font-weight:600;line-height:1.4}
.inst{border-color:var(--bl);background:var(--bs)}
.kn{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--mu);white-space:nowrap}.kn.on{background:var(--g);border-color:var(--g);color:var(--s)}.it3.kd b{opacity:.75}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{background:var(--bs);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
</style></head><body><div class="w" id="app"></div>

cher": "Szabó Emese", "topic": "Egyéb", "c": 1794385831148.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}, {"en": "spread like wildfire", "hu": "futótűzként terjed", "pos": "kif", "example": "The news spread like wildfire.", "book": "Nyári szólista", "lesson": "Szólista 646–670", "teacher": "Szabó Emese", "topic": "Egyéb", "c": 1794385831149.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}, {"en": "Pentecost", "hu": "pünkösd", "pos": "fn", "example": "We have a holiday at Pentecost.", "book": "Nyári szólista", "lesson": "Szólista 646–670", "teacher": "Szabó Emese", "topic": "Idő és dátum", "c": 1794385831150.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}, {"en": "avoid like the plague", "hu": "kerül, mint a pestist", "pos": "kif", "example": "He avoids homework like the plague.", "book": "Nyári szólista", "lesson": "Szólista 646–670", "teacher": "Szabó Emese", "topic": "Egyéb", "c": 1794385831151.0, "known": false, "enAlt": [], "kb": 0, "kr": 0, "kw": 0, "kl": 0}], "log": {}, "facts": {"past": [{"en": "The name 'Fradi' comes from German! Over 100 years ago many people in Budapest spoke German, and they called the Ferencváros district 'Franzstadt'. Franzstadt became 'Fradi'.", "t": "A „Fradi” név a németből jön! Több mint 100 éve Budapesten sokan beszéltek németül, és a Ferencvárost „Franzstadtnak” hívták. A Franzstadtból lett a Fradi.", "team": "fradi"}, {"en": "In the 1931–32 season Fradi won all 22 league games. No draws, no defeats: a perfect season!", "t": "Az 1931–32-es idényben a Fradi mind a 22 bajnoki meccsét megnyerte. Se döntetlen, se vereség: tökéletes szezon!", "team": "fradi"}, {"en": "In summer 1929 Fradi crossed the ocean and toured South America for weeks. Their last game there was against São Paulo in Brazil.", "t": "1929 nyarán a Fradi átkelt az óceánon, és hetekig túrázott Dél-Amerikában. Az utolsó meccsét ott a brazil São Paulo ellen játszotta.", "team": "fradi"}, {"en": "In the 1937 Mitropa Cup final in Rome, Lazio led 4–2 against Fradi. Fradi fought back and won 5–4! György Sárosi scored 12 goals in that tournament.", "t": "Az 1937-es Közép-európai Kupa döntőjében Rómában a Lazio 4–2-re vezetett a Fradi ellen. A Fradi fordított, és 5–4-re nyert! Sárosi György 12 gólt lőtt a sorozatban.", "team": "fradi"}, {"en": "In the 1950s the communist government made Fradi change its name to 'Kinizsi' and its colours to red and white. The fans hated it. In 1956 green and white came back.", "t": "Az 1950-es években a kommunista hatalom arra kényszerítette a Fradit, hogy a nevét „Kinizsire”, a színeit piros-fehérre cserélje. A szurkolók gyűlölték. 1956-ban visszatért a zöld-fehér.", "team": "fradi"}, {"en": "In 1955, 98,000 fans watched Kinizsi (that was Fradi's name then) play Honvéd. It is the biggest crowd ever at a Hungarian league match.", "t": "1955-ben 98 ezer néző látta a Kinizsi (akkor így hívták a Fradit) – Honvéd meccset. Ez minden idők legnagyobb nézőszáma magyar bajnokin.", "team": "fradi"}, {"en": "László Kubala played for Fradi as a teenager. Later he became Barcelona's great hero: there is a statue of him at the Camp Nou. He played for three national teams: Hungary, Czechoslovakia and Spain!", "t": "Kubala László tinédzserként a Fradiban játszott. Később a Barcelona legendája lett, szobra áll a Camp Nounál. Három válogatottban is játszott: Magyarország, Csehszlovákia és Spanyolország!", "team": "fradi"}, {"en": "In 1911 Fradi opened the first stadium in Hungary built only for football, on Üllői út. The first goal there was scored by Imre Schlosser, who scored more than 400 goals in his career.", "t": "1911-ben a Fradi nyitotta meg Magyarország első kifejezetten focira épült stadionját az Üllői úton. Az első gólt ott Schlosser Imre lőtte, akinek több mint 400 gólja volt.", "team": "fradi"}, {"en": "Inter was founded on 9 March 1908 in a Milan restaurant called 'L'Orologio', which means 'The Clock'.", "t": "Az Intert 1908. március 9-én alapították egy milánói étteremben, amelynek neve „L'Orologio”, vagyis „Az Óra”.", "team": "inter"}, {"en": "In 1928 Italy's fascist government did not like the name 'Internazionale': it sounded too international. Inter had to become 'Ambrosiana', after Milan's saint. The old name only came back in 1945.", "t": "1928-ban az olasz fasiszta kormánynak nem tetszett az „Internazionale” név, mert túl nemzetközinek hangzott. Az Internek „Ambrosianára” kellett változnia, Milánó védőszentje után. A régi név csak 1945-ben tért vissza.", "team": "inter"}, {"en": "At the 1938 World Cup, Inter star Giuseppe Meazza took a penalty against Brazil while holding up his shorts with one hand. The elastic had broken! He scored anyway.", "t": "Az 1938-as vb-n az Inter sztárja, Giuseppe Meazza úgy lőtte a tizenegyest Brazília ellen, hogy fél kézzel a nadrágját fogta, mert elszakadt a gumija! Így is berúgta.", "team": "inter"}, {"en": "In the 2010 Champions League final, Inter's starting eleven did not have a single Italian player. They still beat Bayern 2–0.", "t": "A 2010-es BL-döntőben az Inter kezdőcsapatában egyetlen olasz játékos sem volt. Így is 2–0-ra verték a Bayernt.", "team": "inter"}, {"en": "As a teenager, Javier Zanetti got up at 4 a.m. to deliver milk. A big club in Argentina had told him he was too thin to become a footballer. Later he played 858 games for Inter.", "t": "Javier Zanetti tinédzserként hajnali 4-kor kelt, hogy tejet hordjon ki. Egy nagy argentin klub azt mondta neki, túl vékony ahhoz, hogy focista legyen. Később 858 meccset játszott az Interben.", "team": "inter"}, {"en": "In 2010 Inter lost 1–0 at Barcelona but still reached the Champions League final. When Mourinho ran onto the pitch to celebrate, the stadium turned on the water sprinklers!", "t": "2010-ben az Inter 1–0-ra kikapott Barcelonában, mégis bejutott a BL-döntőbe. Amikor Mourinho kirohant ünnepelni, a stadionban bekapcsolták a locsolókat!", "team": "inter"}, {"en": "Inter's first-ever league title came in 1910, only two years after the club was founded.", "t": "Az Inter már 1910-ben megnyerte első bajnoki címét, mindössze két évvel az alapítás után.", "team": "inter"}, {"en": "The Brazilian Ronaldo cost Inter a world record fee in 1997. Fans called him 'Il Fenomeno', the Phenomenon. He is a different person from Cristiano Ronaldo!", "t": "A brazil Ronaldóért az Inter 1997-ben világrekord összeget fizetett. A szurkolók „Il Fenomenónak”, a Jelenségnek hívták. Ő nem azonos Cristiano Ronaldóval!", "team": "inter"}, {"en": "Liverpool's very first team had no English players at all. Almost everyone came from Scotland, so people called them 'the team of Macs' (McQueen, McBride, McLean…).", "t": "A Liverpool legelső csapatában egyetlen angol játékos sem volt. Szinte mindenki Skóciából jött, ezért „a Mac-ek csapatának” hívták őket (McQueen, McBride, McLean…).", "team": "lfc"}, {"en": "Liverpool exists because of a fight about rent! In 1892 Everton would not pay more rent for Anfield and moved out. The owner had an empty stadium, so he started a new club.", "t": "A Liverpool egy bérleti vita miatt létezik! 1892-ben az Everton nem akart több bérleti díjat fizetni az Anfieldért, és elköltözött. A tulajdonosnak maradt egy üres stadionja, ezért új klubot alapított.", "team": "lfc"}, {"en": "Before the 1977 European Cup final in Rome, coach Bob Paisley told his players: the last time I was in Rome, I came on a tank in 1944 to free the city. Liverpool won 3–1.", "t": "Az 1977-es BEK-döntő előtt Rómában Bob Paisley edző azt mondta a játékosainak: amikor legutóbb Rómában jártam, 1944-ben egy tankon érkeztem, hogy felszabadítsuk a várost. A Liverpool 3–1-re nyert.", "team": "lfc"}, {"en": "Liverpool used to play in white shorts. In 1964 Bill Shankly gave captain Ron Yeats red shorts to try on and said: 'You look 7 feet tall!' Since then Liverpool play in all red.", "t": "A Liverpool régen fehér nadrágban játszott. 1964-ben Bill Shankly piros nadrágot adott Ron Yeats csapatkapitánynak, és azt mondta: „Két méter tíznek nézel ki!” Azóta játszik a Liverpool csupa pirosban.", "team": "lfc"}, {"en": "Liverpool's biggest ever win is 11–0 against Strømsgodset from Norway in 1974. Every outfield player scored except one: Brian Hall.", "t": "A Liverpool legnagyobb győzelme a norvég Strømsgodset elleni 11–0 1974-ben. Egy kivétellel minden mezőnyjátékos gólt lőtt, csak Brian Hall nem.", "team": "lfc"}, {"en": "In May 2021 goalkeeper Alisson scored a header in the 95th minute against West Brom. He was the first Liverpool goalkeeper to score in 129 years!", "t": "2021 májusában Alisson kapus a 95. percben fejjel gólt lőtt a West Bromnak. Ő lett az első Liverpool-kapus, aki gólt szerzett, 129 év alatt!", "team": "lfc"}, {"en": "In the 2005 Champions League final penalty shootout, Liverpool's goalkeeper Jerzy Dudek did crazy 'spaghetti legs' on the line, copying Bruce Grobbelaar from the 1984 final. It worked: Liverpool won!", "t": "A 2005-ös BL-döntő tizenegyespárbajában Jerzy Dudek, a Liverpool kapusa „spagettilábakkal” táncolt a gólvonalon, Bruce Grobbelaart utánozva az 1984-es döntőből. Bejött: a Liverpool nyert!", "team": "lfc"}, {"en": "Ian Callaghan played 857 games for Liverpool. That is still the club record, from 1960 to 1978.", "t": "Ian Callaghan 857 meccset játszott a Liverpoolban 1960 és 1978 között. Ez máig klubrekord.", "team": "lfc"}, {"en": "As a little boy in Madeira, Ronaldo had two nicknames: 'Abelhinha', which means 'little bee', because he was so fast, and 'cry baby', because he cried when his team lost.", "t": "Kisfiúként Madeirán Ronaldónak két beceneve volt: „Abelhinha”, vagyis „kis méhecske”, mert olyan gyors volt, és „sírós baba”, mert sírt, ha a csapata kikapott.", "team": "cr7"}, {"en": "At 15, doctors found that Ronaldo's heart was beating too fast even when he was resting. He had laser surgery, and a few days later he was back at training!", "t": "15 évesen az orvosok észrevették, hogy Ronaldo szíve nyugalomban is túl gyorsan ver.
