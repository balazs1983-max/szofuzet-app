<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Szófüzet</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#356C40"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Szófüzet"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#F3F6F3;--s:#fff;--ink:#17291C;--mu:#556B5A;--li:#D5E1D7;--bl:#356C40;--bs:#E2ECE4;--mk:#C9DFCC;--g:#356C40;--gs:#E2ECE4;--b:#C2363A;--bss:#FBE3E3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A12;--s:#172A1B;--ink:#EAF6EE;--mu:#A3B8A7;--li:#2B4631;--bl:#8CBF97;--bs:#24432B;--mk:#4C7D55;--g:#5BD394;--gs:#163D33;--b:#FF8A8D;--bss:#4A1F2A;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
.w{max-width:600px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0;font-weight:800}h1 span{background:linear-gradient(transparent 55%,var(--mk) 55%)}
h2{font-size:19px;margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}.tn{font-variant-numeric:tabular-nums}
.card{background:var(--s);border:1px solid var(--li);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--bl);border-color:var(--bl);color:var(--s)}.btn.gh{border-color:transparent;background:none;color:var(--bl);padding-inline:8px}
.btn.hd{border-color:var(--b);color:var(--b)}
.btn:disabled{opacity:.5}
.nav{display:flex;gap:4px;border-bottom:1px solid var(--li)}
.nav button{flex:1;border:0;background:none;padding:8px 4px 10px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;cursor:pointer}
.nav button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--bl)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--bl);border-color:var(--bl);color:var(--s)}
.seg{display:flex;flex-wrap:wrap;gap:4px}.seg button{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:7px 12px;font-weight:600;cursor:pointer}
.lbl{font-size:13px;font-weight:600;color:var(--mu);margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--li);overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
.fc{min-height:220px;border-radius:20px;border:1px solid var(--li);background:var(--s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;cursor:pointer}
.fc.back{background:var(--bs)}
.big{font-size:32px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.ex{font-style:italic;color:var(--mu);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{text-align:left;border:1px solid var(--li);background:var(--s);border-radius:12px;padding:13px 14px;cursor:pointer}
.opt.ok{background:var(--gs);border-color:var(--g)}.opt.no{background:var(--bss);border-color:var(--b)}
.list{background:var(--s);border:1px solid var(--li);border-radius:14px}
.it{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:9px 14px;border-bottom:1px solid var(--li)}.it:last-child{border:0}
.it b{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--b);background:var(--bss);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.inp{width:100%;border:1px solid var(--li);background:var(--s);border-radius:10px;padding:10px 12px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:90px}
.days i{display:block;background:var(--bl);border-radius:3px 3px 0 0;min-height:2px}
.days i.z{background:var(--li)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800}
.warn{background:var(--bss);color:var(--b);border-radius:10px;padding:10px 12px;font-size:14px}
.say{border:0;background:none;cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;vertical-align:middle;border-radius:8px}
.fb{border-radius:10px;padding:10px 12px;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.fb.ok{background:var(--gs)}.fb.no{background:var(--bss)}
.it3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:6px 14px;border-bottom:1px solid var(--li)}.it3:last-child{border:0}
.fire{gap:10px}.flame{display:flex;align-items:center;gap:2px;font-size:28px;line-height:1}.flame b{font-size:26px;font-weight:800}.flame.off{filter:grayscale(1);opacity:.55}
.bar.goal i{background:var(--g)}.days i.g{background:var(--g)}
.pts{font-size:22px;font-weight:800;color:var(--bl)}
.ov{position:fixed;inset:0;background:rgba(6,30,16,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.pop{width:100%;max-width:440px;max-height:90vh;overflow:auto}
.fact{border:1px solid var(--li);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.team{background:var(--bl);color:var(--s);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.fen{font-size:16px;font-weight:600;line-height:1.4}
.inst{border-color:var(--bl);background:var(--bs)}
.kn{border:1px solid var(--li);background:var(--s);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;cursor:pointer;color:var(--mu);white-space:nowrap}.kn.on{background:var(--g);border-color:var(--g);color:var(--s)}.it3.kd b{opacity:.75}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{background:var(--bs);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
</style></head><body><div class="w" id="app"></div>
<script>
const DATA = __DATA__;
const app = document.getElementById("app");
const K = w => w.book + "|" + w.lesson + "|" + w.en;
let STORE_OK = true;
function load(k, d) { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { STORE_OK = false; return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { STORE_OK = false; } }
let P = load("szf-p", {}), LG = load("szf-log", {}), OWN = load("szf-own", []);
let FZ = load("szf-fz", { n: 0, spent: 0 }), BD = load("szf-badges", []), FS = load("szf-fs", { p: [], n: [], tp: 0, tn: 0 }), GOT = load("szf-got", []);
const FACTS = DATA.facts || { past: [], now: [] };
// own words that already came back in a newer file are not kept twice
const dataKeys = new Set(DATA.words.map(K));
if (OWN.some(o => dataKeys.has(K(o)))) { OWN = OWN.filter(o => !dataKeys.has(K(o))); save("szf-own", OWN); }
const lk = w => w.book + " · " + w.lesson;
const OWN_BOOK = "Saját", OWN_LESSON = "Saját szavak", OWN_L = OWN_BOOK + " · " + OWN_LESSON;
let W = [], lessons = [];
function rebuild() { W = [...DATA.words, ...OWN]; lessons = [...new Set(W.map(lk))]; }
rebuild();
// progress: the newer of this phone's record and what came with the file
function pr(w) { const l = P[K(w)]; const e = w.kl ? { b: w.kb || 0, r: w.kr || 0, w: w.kw || 0, l: w.kl } : null; if (l && (!e || l.l >= e.l)) return l; return e || { b: 0, r: 0, w: 0, l: 0 }; }
const box = w => pr(w).b;
// "tudom": marked by hand (k = 1), sent marked from the notebook (w.known), or answered right 4 times in a row (box 4)
const known = w => { const k = (P[K(w)] || {}).k; return k === 1 || (k !== 0 && !!w.known) || box(w) >= 4; };
function setKnown(w, on) { const p = pr(w); P[K(w)] = { ...p, ...(P[K(w)] || {}), b: on ? p.b : Math.min(p.b, 3), k: on ? 1 : 0, l: Date.now() }; save("szf-p", P); }
const hard = w => { const p = pr(w); return !known(w) && p.w > 0 && p.b < 3; };
function logDay(d) { const a = LG[d], b = (DATA.log || {})[d]; if (a && b) return (a.ans >= b.ans ? a : b); return a || b || null; }
function allDays() { return [...new Set([...Object.keys(LG), ...Object.keys(DATA.log || {})])].sort(); }
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
// ----- installed app -----
const ONLINE_APP = location.protocol === "https:";
const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (ONLINE_APP && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.bip = e; R(); });
const S = { view: "home", by: "lesson", topics: new Set(), dsel: "", sel: new Set(), hard: false, incKnown: false, mode: "flash", dir: "en", count: 20, s: null, q: "", rep: "", add: { en: "", hu: "", L: "", topic: "" }, msg: null };
function h(t, a, ...k) { const e = document.createElement(t); for (const [n, v] of Object.entries(a || {})) { if (v == null || v === false) continue; if (n.startsWith("on")) e.addEventListener(n.slice(2), v); else if (n === "class") e.className = v; else if (n === "value") e.value = v; else e.setAttribute(n, v === true && !n.startsWith("aria-") ? "" : String(v)); } for (const c of k.flat(9)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c)); return e; }
const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const n = s => (s || "").toLowerCase().trim();
const tag = w => hard(w) ? h("span", { class: "tag" }, "nehéz") : null;

// ----- pronunciation -----
const CAN_SAY = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function say(t, e) { if (e) e.stopPropagation(); try { const u = new SpeechSynthesisUtterance(t); u.lang = "en-GB"; u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (_) {} }
const sb = t => CAN_SAY && t ? h("button", { class: "say", type: "button", "aria-label": "Kiejtés: " + t, title: "Meghallgatom", onclick: e => say(t, e) }, "🔊") : null;

// ----- typed answers -----
function fold(s) { return (s || "").toString().toLowerCase().replace(/[’‘`]/g, "'").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\([^)]*\)/g, " ").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim(); }
function clean(s, en) { let x = (s || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/\([^)]*\)/g, " ").replace(/[.!?]+$/, "").replace(/\s+/g, " ").trim(); if (en) x = x.replace(/^to /, ""); return x; }
function lev(a, b) { if (Math.abs(a.length - b.length) > 1) return 2; const d = []; for (let i = 0; i <= a.length; i++) d[i] = [i]; for (let j = 1; j <= b.length; j++) d[0][j] = j; for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); return d[a.length][b.length]; }
// lenient match: every typed word must match a word of one accepted meaning (endings allowed),
// and it must cover at least half of that meaning ("nagyobbá válik" ~ "nagyobb léptékűvé válik");
// typing English must cover the whole phrase, so "give" is not "give up". Close prefixes need 80 %
// in common, so "kölcsönad" never passes for "kölcsönkér".
const toks = s => fold(s).split(" ").filter(t => t.length >= 2);
function stemEq(a, b) { if (a === b) return true; const m = Math.min(a.length, b.length); if (m < 4 || Math.abs(a.length - b.length) > 3) return false; const k = Math.max(4, Math.ceil(m * 0.8)); return a.slice(0, k) === b.slice(0, k); }
function loose(input, alt, strict) { const it = toks(input), at = toks(alt); if (!it.length || !at.length) return false; if (!it.every(t => at.some(a => stemEq(t, a)))) return false; const cov = at.filter(a => it.some(t => stemEq(t, a))).length; return cov >= (strict ? at.length : Math.ceil(at.length / 2)); }
function chk(input, target, en, extra) {
  const alts = [...(target || "").split(/[,;\/]/), ...(extra || [])].map(x => x.trim()).filter(Boolean);
  const x = clean(input, en); if (!x) return { empty: true };
  if (alts.some(t => clean(t, en) === x)) return { ok: true };
  const f = fold(x);
  if (en) {
    // typing English: spelling counts, as in a school test; only case, a leading "to" and punctuation are forgiven
    const a = alts.find(t => fold(clean(t, en)) === f); if (a) return { ok: true, note: "Jó! Pontosan így írjuk: " + a };
    const b = alts.find(t => fold(clean(t, en)).length >= 4 && lev(fold(clean(t, en)), f) <= 1); if (b) return { ok: false, near: true, note: "Majdnem! Egy betű eltér. Helyesen: " + b };
    return { ok: false };
  }
  // typing Hungarian: understanding counts, so any listed meaning passes, with endings, a typo or missing accents
  const a = alts.find(t => fold(clean(t, en)) === f); if (a) return { ok: true, note: "Jó! Figyelj az ékezetekre: " + a };
  const b = alts.find(t => fold(clean(t, en)).length >= 5 && lev(fold(clean(t, en)), f) <= 1); if (b) return { ok: true, note: "Jó, egy betű eltér. Pontosan: " + b };
  const c = alts.find(t => loose(x, clean(t, en), false)); if (c) return { ok: true, note: "Jó! A szófüzetben így szerepel: " + c };
  return { ok: false };
}

// ----- what to practise: by lesson, by topic, or by when the words were added -----
const TOPICS = ["Család és barátok", "Iskola", "Sport", "Étel és ital", "Utazás", "Időjárás", "Természet és állatok", "Otthon", "Város és közlekedés", "Munka", "Érzések", "Test és egészség", "Szabadidő", "Technika", "Ruha", "Idő és dátum", "Egyéb"];
const topicOf = w => (w.topic || "").trim() || "Egyéb";
const dayOfMs = ms => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function dateMatch(c, sel) { if (!sel) return true; if (!c) return false; if (sel === "today") return dayOfMs(c) === today(); if (sel === "7" || sel === "30") return Date.now() - c <= +sel * 864e5; return dayOfMs(c) === sel; }
const dlabel = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("hu-HU", { month: "short", day: "numeric" }); };
const chip = (t, on, f) => h("button", { class: "chip", "aria-pressed": on, onclick: f }, t);
function pool() {
  let ws = W.slice();
  if (S.by === "lesson" && S.sel.size) ws = ws.filter(w => S.sel.has(lk(w)));
  if (S.by === "topic" && S.topics.size) ws = ws.filter(w => S.topics.has(topicOf(w)));
  if (S.by === "date" && S.dsel) ws = ws.filter(w => dateMatch(w.c, S.dsel));
  if (S.hard) ws = ws.filter(hard); return ws;
}
function filterBox() {
  let chips;
  if (S.by === "lesson") chips = [chip("Mind", S.sel.size === 0, () => { S.sel.clear(); R(); }), ...lessons.map(L => chip(L, S.sel.has(L), () => { S.sel.has(L) ? S.sel.delete(L) : S.sel.add(L); R(); }))];
  else if (S.by === "topic") {
    const cnt = {}; for (const w of W) cnt[topicOf(w)] = (cnt[topicOf(w)] || 0) + 1;
    chips = [chip("Mind", S.topics.size === 0, () => { S.topics.clear(); R(); }), ...Object.keys(cnt).sort((a, b) => a.localeCompare(b, "hu")).map(t => chip(`${t} (${cnt[t]})`, S.topics.has(t), () => { S.topics.has(t) ? S.topics.delete(t) : S.topics.add(t); R(); }))];
  } else {
    const days = {}; for (const w of W) if (w.c) { const k = dayOfMs(w.c); days[k] = (days[k] || 0) + 1; }
    chips = [["", "Mind"], ["today", "Ma"], ["7", "Elmúlt 7 nap"], ["30", "Elmúlt 30 nap"]].map(([v, t]) => chip(t, S.dsel === v, () => { S.dsel = v; R(); }))
      .concat(Object.keys(days).sort().reverse().slice(0, 8).map(k => chip(`${dlabel(k)} (${days[k]})`, S.dsel === k, () => { S.dsel = k; R(); })));
  }
  return h("div", {}, h("div", { class: "lbl" }, "Mit gyakorolsz?"),
    h("div", { class: "seg" }, [["lesson", "Lecke"], ["topic", "Témakör"], ["date", "Dátum"]].map(([v, t]) => h("button", { "aria-pressed": S.by === v, onclick: () => { S.by = v; R(); } }, t))),
    h("div", { class: "chips", style: "margin-top:8px" }, chips),
    S.by === "date" ? h("div", { class: "mu sm", style: "margin-top:4px" }, "Aszerint, mikor került be a szó a szófüzetbe.") : null);
}
// what goes into a round: missed words first, then the not-yet-known ones from the weakest up;
// known words come back only for review, about one in five while there is enough left to learn
function pickRound(all, count) {
  const n = count || all.length, pri = w => (hard(w) ? 0 : 1);
  const learn = sh(all.filter(w => !known(w))).sort((a, b) => (pri(a) - pri(b)) || (box(a) - box(b)));
  const kn = sh(all.filter(known));
  const kCap = Math.min(kn.length, learn.length >= n ? Math.round(n * 0.2) : n - learn.length);
  return learn.slice(0, n - kCap).concat(kn.slice(0, kCap));
}
function start(list) {
  const l = list ? sh(list) : sh(pickRound(pool(), S.count));
  S.s = { l: l.map(w => ({ w, d: S.dir === "mix" ? (Math.random() < .5 ? "en" : "hu") : S.dir })), i: 0, r: 0, miss: [], f: false, pk: null, t: Date.now(), ty: "", ck: null };
  const d = today(); const cur = logDay(d) || { sec: 0, ans: 0, ok: 0, ses: 0 }; LG[d] = { ...cur, ses: cur.ses + 1 }; save("szf-log", LG);
  S.view = "play"; R();
}
// ----- rewards -----
const GOAL = 900, GOAL_WORDS = 25;            // 15 minutes a day keeps the streak alive; every further 15 minutes earns more football facts
const PTS = { flash: 3, quiz: 6, type: 10 };   // harder recall earns more; flashcards are self-graded, so they earn least
const LEVEL = 300, FREEZE_COST = 500, FREEZE_MAX = 2;
const dk = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const BADGES = [["⚽", "Starting XI"], ["🥅", "Goal Machine"], ["🎩", "Hat-trick Hero"], ["🎖️", "Captain"], ["🏆", "Champion"], ["💚", "Fradi Heart"], ["🖤", "Nerazzurro"], ["❤️", "You'll Never Walk Alone"], ["⭐", "CR7"], ["👑", "Legend"]];
const badgeOf = n => { const i = n / 10 - 1; return i < BADGES.length ? BADGES[i] : ["👑", "Legend " + n]; };
const TEAM = { fradi: ["Fradi", "#1B7F3B"], inter: ["Inter", "#1E4FB0"], lfc: ["Liverpool", "#C8102E"], cr7: ["CR7", "#A86F00"] };
const ORDER = ["fradi", "inter", "lfc", "cr7"];
function addXp(x) { const d = today(); const cur = logDay(d) || { sec: 0, ans: 0, ok: 0, ses: 1 }; LG[d] = { ...cur, xp: (cur.xp || 0) + x }; save("szf-log", LG); }
function totalXp() { return allDays().reduce((a, d) => a + ((logDay(d) || {}).xp || 0), 0); }
const balance = () => totalXp() - (FZ.spent || 0);
function rec(w, ok, kind) {
  const s = S.s; if (ok) s.r++; else s.miss.push(w);
  const wasHard = hard(w);
  const p = pr(w); const now = Date.now();
  const wasKnown = known(w), prev = P[K(w)] || {};
  P[K(w)] = { ...prev, b: ok ? Math.min(4, p.b + 1) : 0, r: p.r + (ok ? 1 : 0), w: p.w + (ok ? 0 : 1), l: now, ...(ok ? {} : { k: 0 }) };
  if (!wasKnown && known(w)) (s.newK = s.newK || []).push(w);
  let x = 0, bonus = "";
  if (ok) {
    x = PTS[kind] || 3; if (wasHard) { x += Math.ceil(x / 2); bonus = "nehéz szó"; }
    s.cb = (s.cb || 0) + 1; s.best = Math.max(s.best || 0, s.cb);
